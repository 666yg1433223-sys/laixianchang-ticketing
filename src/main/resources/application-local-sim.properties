# Local teaching environment only: no real text messages or real money.
server.port=18082
biz.db.name=ticketing_biz01
biz.db.user=ticketing_biz01_app
biz.db.migrator=ticketing_biz01_migrator
biz.db.host=127.0.0.1
biz.db.port=13306
biz.redis.host=127.0.0.1
biz.redis.port=16379
biz.simulation.enabled=true
biz.sim.management.enabled=false
# Explicit local demo identity; it must still pass the one-time log code check.
# Empty value disables administrator login. Never bind this teaching profile to a public address.
biz.local.admin-phone=13900000000
logging.level.com.ticketing.booking.auth.AuthService=INFO
# A stable offset timestamp lets the private local launcher reject expired log codes.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level %logger{36} - %msg%n
logging.charset.console=UTF-8
