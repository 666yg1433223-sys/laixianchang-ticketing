<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#164b3e">
    <meta name="color-scheme" content="light">
    <meta name="description" content="来现场，发现值得赴约的活动，选择场次与票档，在票夹管理订单和候补。">
    <title>来现场 · 把喜欢，留给现场</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">跳至主要内容</a>
    <header class="site-header">
      <div class="header-inner">
        <a href="#discover" class="brand" aria-label="来现场，回到活动首页">
          <span class="brand-mark" aria-hidden="true">来</span>
          <span>来现场<small>为喜欢，赴一场约</small></span>
        </a>
        <nav class="site-nav" aria-label="主导航">
          <a href="#discover" data-nav="discover">发现活动</a>
          <a href="#tickets" data-nav="tickets">我的票夹</a>
          <a href="#manage" data-nav="manage" id="manage-link" hidden>活动管理</a>
        </nav>
        <div id="account"></div>
      </div>
    </header>
    <div class="demo-strip">
      <span class="demo-label"><span class="live-dot" aria-hidden="true"></span>本地体验版</span>
      <span>验证码、付款与退款均为模拟，无真实资金交易</span>
    </div>
    <main id="main" tabindex="-1" aria-label="票务内容"></main>
    <noscript><p class="notice error">请在浏览器中启用 JavaScript，以查看活动和管理门票。</p></noscript>
    <footer class="site-footer">
      <a href="#discover" class="footer-brand">来现场<span>把喜欢，留给现场。</span></a>
      <p>每人每场限一张 · 候补成功后需手动付款<br>活动开始前可全额模拟退款</p>
      <a class="footer-link" href="#tickets">查看我的票夹 <span aria-hidden="true">↗</span></a>
    </footer>
    <dialog id="modal" aria-labelledby="modal-title">
      <div class="dialog-shell">
        <button type="button" class="icon-btn close-modal" data-action="close-modal" aria-label="关闭弹窗">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
        <div id="modal-content"></div>
      </div>
    </dialog>
    <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false" aria-relevant="additions"></div>
  </body>
</html>
